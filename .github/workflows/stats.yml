name: Generate stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_USER: Ema-27
          INCLUDE_PRIVATE: "true"
          # EXCLUDED_LANGS: "HTML,CSS"
          # EXCLUDED_REPOS: "repo-da-ignorare"
        run: python3 generate_stats.py

      - name: Publish to stats-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir /tmp/out && cp generated/*.svg /tmp/out/
          git checkout --orphan stats-output
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/out/*.svg .
          git add *.svg
          git commit -m "Update stats"
          git push --force origin stats-output
